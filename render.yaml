# Render blueprint: one web service (API plus the web app) and one Postgres database.
# Plans are left out on purpose. Pick them in the Render dashboard when you create the blueprint.
services:
  - type: web
    name: tys
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tys-db
          property: connectionString
      - key: TYS_ACCESS_CODE
        generateValue: true
      - key: SEED_SAMPLE
        value: "1"
databases:
  - name: tys-db
